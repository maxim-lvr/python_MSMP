<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Wide Restrict Area</title>
  <script type="importmap">{"imports":{"three":"./web/vendor/three.module.js"}}</script>
  <style>
    *{box-sizing:border-box;letter-spacing:0}body{margin:0;font:13px Arial,sans-serif;color:#283536;background:#d1d9db;overflow:hidden}
    canvas{display:block;touch-action:none}#panel{position:fixed;top:10px;left:10px;max-width:calc(100% - 20px);width:fit-content;background:#f8fafaf2;border:1px solid #c2cccc;padding:10px 12px;z-index:2}
    header{display:flex;align-items:center;justify-content:space-between;gap:24px}h1{font-size:16px;margin:0}a{color:#356b68}#stats{color:#586462;line-height:1.5;margin:7px 0}.controls{display:flex;align-items:center;gap:7px;flex-wrap:wrap}.cut{border-top:1px solid #d7dddd;margin-top:8px;padding-top:8px}
    button,input,select{font:inherit;border:1px solid #b7c3c0;background:#fff;color:inherit;min-height:32px;border-radius:3px;padding:5px 8px}button{cursor:pointer}button:hover{background:#e7eeeb}button[aria-pressed="true"]{background:#356b68;color:#fff}input[type=number]{width:112px}label{display:flex;align-items:center;gap:5px}input[type=range]{width:100px;padding:0}input[type=checkbox]{min-height:0;accent-color:#356b68}#cut-value{width:32px;font-variant-numeric:tabular-nums}#position{position:fixed;right:12px;bottom:12px;padding:6px 9px;background:#f8faf9da;pointer-events:none;font-variant-numeric:tabular-nums}
    #mobile{display:none;position:fixed;bottom:18px;left:12px;gap:6px;z-index:2}#mobile button{width:42px;height:42px;touch-action:none}
    @media(pointer:coarse){#mobile{display:flex}#position{bottom:72px}}@media(max-width:540px){#panel{padding:8px}h1{font-size:15px}.controls{gap:5px}#stats{font-size:12px}button,input,select{min-height:30px;padding:4px 6px}}
  </style>
</head>
<body>
  <section id="panel">
    <header><h1>Wide Restrict Area</h1><a href="./index.html">Menu</a></header>
    <p id="stats" role="status">Chargement...</p>
    <form id="settings" class="controls">
      <label>Seed <input id="seed" type="number" min="0" max="4294967295" value="42" required></label>
      <button type="submit">Generer</button><button type="button" id="random">Aleatoire</button>
      <button type="button" id="fly" aria-pressed="true">Vol</button><button type="button" id="overview" aria-pressed="false">Vue globale</button>
      <label>Vitesse <input id="speed" type="range" min="8" max="100" value="28"></label>
    </form>
    <div class="controls cut">
      <label><input id="cut-enabled" type="checkbox">Coupe</label>
      <select id="cut-axis" aria-label="Axe de coupe"><option value="y">Hauteur Y</option><option value="z">Largeur Z</option><option value="x">Longueur X</option></select>
      <input id="cut" type="range" min="1" max="240" value="115" aria-label="Position de la coupe">
      <output id="cut-value" for="cut">115</output>
      <label><input id="cut-reverse" type="checkbox">Inverser</label>
    </div>
  </section>
  <output id="position"></output>
  <nav id="mobile" aria-label="Deplacement"><button data-key="z" title="Avancer">Z</button><button data-key="q" title="Gauche">Q</button><button data-key="s" title="Reculer">S</button><button data-key="d" title="Droite">D</button><button data-key="space" title="Monter">+</button><button data-key="c" title="Descendre">-</button></nav>
  <script type="module" src="./wide_restrict_area_viewer.js"></script>
</body>
</html>
