<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generation Demo</title>
  <script type="importmap">{"imports":{"three":"./web/vendor/three.module.js"}}</script>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; overflow: hidden; background: #e9eeeb; color: #263b32; font: 13px Arial, sans-serif; }
    #viewport { display: block; width: 100%; height: 100%; touch-action: none; }
    #hud { position: absolute; top: 10px; left: 10px; right: 10px; z-index: 2; background: #fffffff2; border: 1px solid #becac2; padding: 12px 14px; }
    header, form, .controls, .modes { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    header { justify-content: space-between; margin-bottom: 10px; }
    h1 { margin: 0; font-size: 16px; }
    #stats { flex: 1 1 280px; margin: 0; color: #617269; }
    a { color: #315d49; }
    .controls { justify-content: space-between; gap: 10px 20px; }
    button, input, select { font: inherit; min-height: 30px; border: 1px solid #b7c4bb; border-radius: 3px; padding: 4px 8px; background: #f5f8f5; color: inherit; }
    button { cursor: pointer; }
    button:hover { background: #dde9e1; }
    button[aria-pressed="true"] { background: #315d49; color: white; border-color: #315d49; }
    #seed { width: 98px; }
    select { max-width: 240px; }
    .setting { display: flex; gap: 6px; align-items: center; }
    .setting input { width: 94px; padding: 0; }
    output { display: inline-block; min-width: 32px; font-variant-numeric: tabular-nums; }
    #minimap { position: absolute; bottom: 12px; right: 12px; width: 200px; height: 200px; border: 1px solid #b7c4bb; background: #ffffffec; cursor: crosshair; touch-action: none; }
    #legend { position: absolute; bottom: 12px; left: 12px; max-width: calc(100% - 240px); display: flex; flex-wrap: wrap; gap: 8px 15px; padding: 9px 12px; background: #fffffff0; border: 1px solid #b7c4bb; }
    #legend span { display: inline-flex; align-items: center; gap: 6px; }
    #legend i { width: 9px; height: 9px; background: var(--color); }
    #perf { font-variant-numeric: tabular-nums; color: #617269; min-width: 105px; }
    #touch { display: none; position: absolute; bottom: 18px; left: 12px; gap: 5px; grid-template-columns: repeat(3, 40px); }
    #touch button { height: 40px; touch-action: none; background: #fffffff0; }
    @media (max-width: 740px) {
      #hud { padding: 9px; }
      header { gap: 5px 10px; margin-bottom: 8px; }
      #stats { flex-basis: 100%; order: 3; font-size: 12px; }
      #perf { display: none; }
      .controls { gap: 8px; }
      select { max-width: 190px; }
      #minimap { width: 130px; height: 130px; }
      #legend { display: none; }
    }
    @media (pointer: coarse) { body[data-mode="fly"] #touch { display: grid; } }
  </style>
</head>
<body data-mode="overview">
  <section id="hud">
    <header><h1>Generation Demo</h1><p id="stats" role="status">Generation...</p><span id="perf"></span><a href="/">Menu</a></header>
    <div class="controls">
      <form id="settings">
        <label for="seed">Seed</label><input id="seed" type="number" min="0" max="4294967295" value="42" required>
        <button type="submit">Generer</button><button id="random" type="button">Aleatoire</button>
      </form>
      <div class="modes"><button id="overview" aria-pressed="true">Vue globale</button><button id="fly" aria-pressed="false">Vol</button></div>
      <select id="sector" aria-label="Build"><option value="">Builds</option></select>
      <label class="setting">Coupe <input id="cut" type="range" min="-64" max="320" value="320"><output id="cut-value">320</output></label>
      <label class="setting">Vue <input id="distance" type="range" min="700" max="2500" step="100" value="1600"><output id="distance-value">1600</output></label>
    </div>
  </section>
  <canvas id="minimap" width="250" height="250" aria-label="Carte des builds et raccords"></canvas>
  <div id="legend"></div>
  <div id="touch">
    <button data-key=" " aria-label="Monter">+</button><button data-key="z" aria-label="Avancer">&#9650;</button><button data-key="c" aria-label="Descendre">-</button>
    <button data-key="q" aria-label="Gauche">&#9664;</button><button data-key="s" aria-label="Reculer">&#9660;</button><button data-key="d" aria-label="Droite">&#9654;</button>
  </div>
  <script type="module" src="./generation_demo_viewer.js"></script>
</body>
</html>
