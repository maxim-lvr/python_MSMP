<!doctype html>
<html lang="fr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Generation Demo Chunks</title>
  <script type="importmap">{"imports":{"three":"./web/vendor/three.module.js"}}</script>
  <style>
    * { box-sizing: border-box; letter-spacing: 0; }
    body { margin: 0; overflow: hidden; background: #edf0f2; color: #283239; font: 13px Arial, sans-serif; }
    canvas { display: block; touch-action: none; }
    #hud { position: absolute; z-index: 2; top: 10px; left: 10px; right: 10px; padding: 10px 12px; background: #fffffff2; border: 1px solid #c7ced2; }
    header, form { display: flex; align-items: center; flex-wrap: wrap; gap: 8px; }
    header { margin-bottom: 8px; }
    h1 { font-size: 15px; margin: 0; }
    #stats { flex: 1 1 260px; margin: 0; color: #56646c; }
    a { color: #2e6466; }
    button, input, select { font: inherit; min-height: 32px; padding: 5px 8px; border: 1px solid #bcc5cb; border-radius: 3px; background: #f8fafb; color: inherit; max-width: 100%; }
    input { width: 94px; }
    .setting { display: inline-flex; align-items: center; gap: 5px; }
    input[type="checkbox"] { width: 16px; min-height: 16px; }
    input[type="range"] { width: 100px; padding: 0; }
    #count { width: 65px; }
    #zone { width: 220px; }
    #cut-value { min-width: 25px; }
    button:disabled { cursor: wait; opacity: 0.55; }
    button { cursor: pointer; }
    button[aria-pressed="true"] { background: #2e6466; color: white; }
    #touch { position: absolute; z-index: 2; bottom: 12px; left: 12px; display: none; grid-template-columns: repeat(3, 42px); gap: 4px; }
    #touch button { height: 42px; touch-action: none; }
    @media (pointer: coarse) { body[data-fly="true"] #touch { display: grid; } }
    @media (max-width: 600px) { #stats { order: 3; flex-basis: 100%; font-size: 12px; } header a { margin-left: auto; } }
  </style>
</head>
<body>
  <section id="hud">
    <header><h1>Generation Demo Chunks</h1><p id="stats" role="status"></p><a href="/">Menu</a></header>
    <form id="settings">
      <label for="seed">Seed</label><input id="seed" type="number" min="0" max="4294967295" value="42" required>
      <label for="count">Pieces / 4 x 4 chunks</label><input id="count" type="number" min="1" max="20" value="11" required>
      <button type="submit">Generer</button><button type="button" id="random">Aleatoire</button>
      <button type="button" id="overview" aria-pressed="true">Vue globale</button><button type="button" id="fly" aria-pressed="false">Vol</button>
      <select id="zone" aria-label="Zone"></select>
      <label class="setting"><input id="inspection" type="checkbox" checked>Inspection</label>
      <label class="setting">Coupe <input id="cut" type="range" min="10" max="300" value="300"><output id="cut-value">300</output></label>
    </form>
  </section>
  <div id="touch">
    <button data-key=" " aria-label="Monter">+</button><button data-key="z" aria-label="Avancer">&#9650;</button><button data-key="c" aria-label="Descendre">-</button>
    <button data-key="q" aria-label="Gauche">&#9664;</button><button data-key="s" aria-label="Reculer">&#9660;</button><button data-key="d" aria-label="Droite">&#9654;</button>
  </div>
  <script type="module" src="./generation_demo_chunks_viewer.js"></script>
</body>
</html>
