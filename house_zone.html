<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>House Wall Test</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: #edf1f4;
        color: #17202a;
        font-family: Arial, sans-serif;
      }

      #hud {
        position: fixed;
        top: 12px;
        left: 12px;
        z-index: 2;
        padding: 10px 12px;
        background: rgba(255, 255, 255, 0.84);
        border: 1px solid rgba(80, 100, 120, 0.22);
        font-size: 13px;
        line-height: 1.4;
      }

      #stats {
        display: block;
        margin-top: 4px;
        color: #435264;
      }

      #controls {
        display: flex;
        gap: 6px;
        margin-top: 8px;
        align-items: center;
      }

      #seed {
        width: 76px;
        padding: 4px 6px;
        border: 1px solid rgba(80, 100, 120, 0.28);
        background: rgba(255, 255, 255, 0.9);
        color: #17202a;
      }

      button {
        padding: 5px 8px;
        border: 1px solid rgba(80, 100, 120, 0.28);
        background: #f8fafc;
        color: #17202a;
        cursor: pointer;
      }

      #help {
        position: fixed;
        left: 12px;
        bottom: 12px;
        z-index: 2;
        padding: 8px 10px;
        background: rgba(255, 255, 255, 0.78);
        border: 1px solid rgba(80, 100, 120, 0.18);
        font-size: 12px;
        color: #435264;
      }
    </style>
  </head>
  <body>
    <div id="hud">
      <strong>House Wall Test</strong>
      <span id="stats">Chargement...</span>
      <div id="controls">
        <input id="seed" type="number" value="42" />
        <button id="update" type="button">Update</button>
        <button id="random" type="button">Random</button>
      </div>
    </div>
    <div id="help">ZQSD bouger · Espace monter · Ctrl/C descendre · Shift rapide · clic souris pour regarder</div>
    <script type="module" src="./house_zone_viewer.js?v=wide-four-walls-houses-20260819"></script>
  </body>
</html>
